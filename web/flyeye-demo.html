<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlyEye demo</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
    #view { display: block; width: min(100%, 720px); aspect-ratio: 4 / 3; background: #000; border-radius: 8px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    #legend { color: #aaa; }
  </style>
</head>
<body>
  <div class="row">
    <input id="file" type="file" accept="image/*" />
    <label>human <input id="mix" type="range" min="0" max="1" step="0.01" value="1" /> fly</label>
  </div>
  <canvas id="view"></canvas>
  <p id="legend"></p>
  <script type="module" src="/src/flyeye/demo.ts"></script>
</body>
</html>
